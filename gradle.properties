# Disable Gradle's file-system watching. A single long-lived daemon serves the main
# tree plus many git worktrees, and files are edited by external tooling. Under that
# load macOS FSEvents overflows and drops change events (observed hundreds of times in
# the daemon logs), leaving the retained VFS snapshot stale. The incremental compiler
# then reads a stale content hash, declares an edited source up-to-date, and skips
# recompilation — so a subsequent test run executes the previous .class. Turning
# watching off makes the daemon re-snapshot from disk each build, trading a sub-second
# re-stat for a guarantee that compilation always sees current file content.
org.gradle.vfs.watch=false
