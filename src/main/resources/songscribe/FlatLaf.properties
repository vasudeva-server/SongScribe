# suppress inspection "UnusedProperty" for whole file
@borderColor = #c0c0c0
[dark]@borderColor = #505050

@baseBackground = #f5f5f5
[dark]@baseBackground = #2d2d30

@darkTextBackground = #242427

# The default size is 13, which is too small for Source Sans 3
defaultFont = 16

# The default dark panel is too dark
[dark]Panel.background = @baseBackground

# Tweak OptionPane spacing
OptionPane.buttonPadding = 13
OptionPane.border = 13,13,13,13
OptionPane.messageAreaBorder = 0,0,0,10
OptionPane.iconMessageGap = 13
OptionPane.maxCharactersPerLine = 50

# Tweak insets for text components
TextField.margin = 2,4,2,4
TextArea.margin = 2,5,2,5
[dark]TextField.background = @darkTextBackground
[dark]TextArea.background = @darkTextBackground
[dark]FormattedTextField.background = @darkTextBackground
[dark]PasswordField.background = @darkTextBackground
[dark]ComboBox.background = @darkTextBackground
[dark]Spinner.background = @darkTextBackground

# Button tweaks
ToggleButton.toolbar.selectedBackground = #8bcdff
[dark]ToggleButton.toolbar.selectedBackground = #2a5a8a
ToggleButton.toolbar.disabledSelectedBackground = lighten($ToggleButton.toolbar.selectedBackground,13%)
ToggleButton.toolbar.hoverBackground = #e6e6e6
[dark]ToggleButton.toolbar.hoverBackground = #4a4a4a

# Toolbar tweaks
ToolBar.background = @baseBackground
[dark]ToolBar.background = @baseBackground
ToolBar.separatorColor = @borderColor
# Don't highlight toolbar button groups on hover
ToolBar.hoverButtonGroupBackground =

# Make SplitPane match
[dark]SplitPane.background = @baseBackground

#
# Custom keys
#

# Custom text inset for TitledBorder, to give it more breathing room
TitledBorder.textInset = 13

# Custom keys for score surround areas
SongScribe.score.panel.background = #c0c0c0
[dark]SongScribe.score.panel.background = #1c1c1f

# ScoreView page (the white paper) — kept light even in dark mode, it's paper
SongScribe.score.page.screen.background = #f9f9f9

# Splash window — intentionally white-on-black even in dark mode (fixed background image)
SongScribe.splash.window.background = #ffffff
SongScribe.splash.window.foreground = #000000
SongScribe.splash.window.padding = 13,13,13,13

#
# Dialog layout properties (accessible via UIManager / DialogLayout)
#

## Shared ##

# Standard horizontal gap between components
SongScribe.dialog.component.horizontal.gap = 5
SongScribe.dialog.component.horizontal.extra.gap = 13

# Standard vertical gap between components
SongScribe.dialog.component.vertical.gap = 5
SongScribe.dialog.component.vertical.extra.gap = 13

# A little space between the top of the dialog and the tabs, to give it some breathing room
SongScribe.dialog.tabs.margin.top = 5

# The standard interior padding when there is no button panel
SongScribe.dialog.std.padding = 20,20,20,20

# The standard interior padding when there is a button panel below
SongScribe.dialog.std.buttons.padding = 20,20,0,20

# No interior padding
SongScribe.dialog.no.padding = 0,0,0,0

# The gap btween sections in the dialog (e.g. the "Appearance" section in the Preferences dialog)
SongScribe.dialog.section.gap = 15

# The interior padding of titled borders in the dialog (e.g. the "Appearance" section in the Preferences dialog)
SongScribe.dialog.titled.border.padding = 33,16,16,16

# The standard horizontal gap between buttons
SongScribe.dialog.button.horizontal.gap = 9

# The padding of the standard button panel at the bottom of dialogs (e.g. the OK/Cancel buttons in the Preferences dialog)
SongScribe.dialog.button.panel.padding = 16,18,18,11

# Indent a label above an input field a bit so it isn't flush with the left edge of the field
SongScribe.dialog.label.indent = 5

## PreferencesDialog ##

# Extra width given to the Preferences dialog to give the sliders more room
SongScribe.dialog.preferences.extra.width = 70

# General tab
SongScribe.dialog.preferences.general.appearance.icon.size = 100
SongScribe.dialog.preferences.general.appearance.padding = 7,0,5,0
SongScribe.dialog.preferences.general.appearance.item.gap = 40

# Play tab
SongScribe.dialog.preferences.play.playback.padding = 35,20,20,20
SongScribe.dialog.preferences.play.slider.gap = 20

# Instruments tab
SongScribe.dialog.preferences.instruments.button.gap = 20
SongScribe.dialog.preferences.instruments.play.button.size = 24.0
SongScribe.dialog.preferences.instruments.play.button.padding = 8,8,8,8

## FontChooser ##

# Extra width given to the FontDialog dialog to give the sliders more room
SongScribe.dialog.font.extra.width = 50

SongScribe.dialog.font.chooser.gap = 11

## Song settings dialog ##

# The interior padding of the font tab in SongSettingsDialog
SongScribe.dialog.song.settings.font.padding = 13,20,0,20

# Inner padding of the font name label (mimics TextField.margin)
SongScribe.dialog.song.settings.font.label.padding = 2,4,2,4

# Padding around the font preview in the Text tab (top/bottom intentionally less than left/right)
SongScribe.dialog.song.settings.font.preview.padding = 10,13,10,13

# Vertical gap between the "Add date" and "Add date and place" buttons in the lyrics tab
SongScribe.dialog.song.settings.lyrics.button.gap = 7

## ScoreView ##

# Gap (in staff spaces) between title and subtitle
SongScribe.score.subtitle.gap = 0.25

# ScoreView interactive state colors — on top of the score page, which is light even in dark mode
SongScribe.score.playing.note.color = #1fcc00
SongScribe.score.preview.element.color = #0388ff
SongScribe.score.selection.color = #ff00ff
