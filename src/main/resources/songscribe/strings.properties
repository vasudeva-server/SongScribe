report.reason.damaged.normal.notes = The file states the note value of the tuplet’s ratio, but not how many of those notes the tuplet takes the time of.
report.reason.damaged.tuplet.number = The file states a tuplet number that no tuplet can have.
report.reason.damaged.unbound = The file places it where no note follows to hold it.
report.reason.damaged.wrong.element = The file places it on an element that cannot carry it.
report.reason.empty.span = The tuplet held no notes or rests, only grace notes.
report.reason.ending.bar.after.end = A barline or repeat cannot directly follow the bar that ends the ending.
report.reason.ending.no.open.section = The repeat that ends its first bracket has no balanced repeated section to go back to.
report.reason.ending.not.valid = The ending is not a valid first or second ending.
report.reason.ending.split.not.right.repeat = The first bracket must end on a right repeat.
report.reason.endpoint.deleted = It started or ended on an element that was deleted.
report.reason.fermata = A fermata inside the tuplet leaves its timing indefinite.
report.reason.hairpin.endpoint.invalid = It started on an element that can no longer start a hairpin, or ended on one that can no longer end it.
report.reason.hairpin.endpoint.unusable = It started on an element that cannot start a hairpin, or ended on one that cannot end it.
report.reason.hairpin.non.single.bar = It crossed a repeat or a barline other than a single barline.
report.reason.hairpin.opposite.overlap = It shared more than one element with a hairpin of the opposite kind.
report.reason.hairpin.too.few.notes = It covered fewer than two notes, so it had nothing to slope across.
report.reason.leading.bar = A song cannot start with a bar line or a repeat.
report.reason.leading.bar.key = A song cannot start with a bar line or a repeat. The key change behind it became the line’s key.
report.reason.no.conventional.span =The number said nothing that the beat does not already say.
report.reason.not.divisible = The notes do not divide evenly by the tuplet number, so it cannot be played as written.
report.reason.not.notatable = Divided by the tuplet number, the notes give a length that no single note value can write.
report.reason.number.equals.normal.notes = The tuplet number equals the number of notes whose time it takes, so it changed nothing.
report.reason.paste.fragment.dropped = It was not pasted, because the paste landed inside one of the same kind.
report.reason.paste.straddled = The paste landed inside it.
report.reason.power.of.two = The group is exactly a shorter note value, so the number changed nothing.
report.reason.replaced = A new one of the same kind was added over it.
report.reason.stated.value.mismatch = The note value the tuplet states does not match the notes it holds.
report.reason.tie.no.following.note = It is no longer followed by a note it can end on.
report.reason.tie.not.held = The notes it joined no longer have the same pitch.
report.reason.too.few.notes = The tuplet held fewer than two notes.
report.reason.tuplet.bar.or.breath.mark = The tuplet crossed a barline, repeat, or breath mark.
report.reason.tuplet.interior.changed = The notes inside it changed, so it is no longer a valid tuplet.
report.ties.removed = A tie was removed
report.title = Messages:
